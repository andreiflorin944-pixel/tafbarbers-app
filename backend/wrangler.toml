name = "tafbarbers-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Adresele proprii (zona tafbarbers.ro e în Cloudflare; site-ul tafbarbers.ro și e-mailul rămân la DataHost).
# app = aplicația și linkurile pentru clienți, panou = panoul de administrare, api = serverul. Adresa workers.dev merge în continuare.
workers_dev = true
routes = [
  { pattern = "app.tafbarbers.ro", custom_domain = true },
  { pattern = "panou.tafbarbers.ro", custom_domain = true },
  { pattern = "api.tafbarbers.ro", custom_domain = true },
]

# Panoul de administrare (admin/dist) e servit de același Worker; doar /v1/* ajunge la API.
# „/” trece prin Worker: la app.tafbarbers.ro arată site-ul (Panou → Site web), în rest panoul.
[assets]
directory = "../admin/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/site", "/robots.txt", "/sitemap.xml", "/v1/*", "/legal/*", "/r/*", "/programare", "/sterge-cont", "/plata/*", "/q/*", "/w/*", "/b/*"]

[[d1_databases]]
binding = "DB"
database_name = "tafbarbers"
database_id = "4590bbc5-67f3-4b9b-94f9-ffb7bbda5efc"
migrations_dir = "migrations"

# Traducerea automată în engleză și franceză a textelor scrise în panou (Workers AI, din contul Cloudflare).
[ai]
binding = "AI"

# Spațiul de fișiere pentru clipurile postate pe rețele (Cloudflare R2). Se pornește după ce R2 e activat în cont:
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "tafbarbers-media"

# Jurnalele Worker-ului (erori, console.error) se păstrează în Cloudflare: Workers → tafbarbers-api → Logs.
[observability]
enabled = true

# Reminder-ele SMS/push rulează la fiecare 5 minute.
[triggers]
crons = ["*/5 * * * *"]

[vars]
TIMEZONE = "Europe/Bucharest"
# Domenii permise pentru panoul admin și aplicația web (separate prin virgulă).
CORS_ORIGINS = "*"
# Adresa din linkurile trimise clienților (QR, plată, programare, pagini legale).
PUBLIC_URL = "https://app.tafbarbers.ro"

# Secrete (se pun cu `npx wrangler secret put NUME`, niciodată în cod):
#   SMSADVERT_TOKEN   cheia API de la smsadvert.ro
#   SMSADVERT_SENDER  phone = SMS-urile pleacă de pe telefonul conectat în SMSAdvert (altfel de pe numărul scurt)
#   EMAIL_API_KEY     cheia furnizorului de e-mail
#   ADMIN_SETUP_KEY   parolă unică pentru crearea primului cont de admin
#   EMAIL_FROM        expeditorul e-mailurilor (ex. TAFBarbers <programari@tafbarbers.ro>)
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET   plata online cu cardul (fără ele plata e doar la salon; pașii sunt în panou, Setări → Plăți online)
#   REVIEW_LOGIN      contul demo pentru Apple / Google, „telefon:cod” (cod din 6 cifre)
#   META_APP_ID, META_APP_SECRET            aplicația Meta pentru postări pe Facebook și Instagram
#   TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET aplicația TikTok pentru postări
