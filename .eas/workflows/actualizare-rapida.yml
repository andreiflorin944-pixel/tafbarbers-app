# Pornit din panou (Aplicații → „Actualizare rapidă”): trimite codul nou direct pe telefoane, fără magazine.
# Ajunge doar la versiunile din magazine care au aceeași parte nativă (runtimeVersion „fingerprint”).
name: Actualizare rapidă din panou
run_name: Actualizare rapidă

on:
  workflow_dispatch:
    inputs:
      message:
        type: string
        required: false

jobs:
  update:
    name: Actualizare rapidă
    type: update
    environment: production
    # Adresa serverului e scrisă în cod la construire. La „eas update” nu se iau variabilele din eas.json,
    # iar fără ea aplicația pornește cu datele de test (adresă „se preia din Barberly”, fără abonamente).
    env:
      EXPO_PUBLIC_API_URL: https://app.tafbarbers.ro
    params:
      branch: production
      message: ${{ inputs.message }}
